name: 'UtiliKit CKEditor'
type: module
description: 'Adds a CKEditor 5 toolbar button that applies UtiliKit utility classes to the selected element, offering only the values this site accepts.'
package: UtiliKit

# Matches utilikit itself. Nothing here needs drupal/ai — this is the editor
# surface, and it works whether or not the AI module is installed.
core_version_requirement: ^11.2 || ^12

dependencies:
  - utilikit:utilikit
  - drupal:ckeditor5
