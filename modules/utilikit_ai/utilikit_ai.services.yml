services:
  # Every utility this site has, read from UtilikitRules and nothing else.
  # A service rather than logic inside a tool plugin, so it can be tested
  # without the AI stack present — the same reason the two sibling modules
  # separate theirs.
  utilikit_ai.rule_catalogue:
    class: Drupal\utilikit_ai\Service\RuleCatalogue

  Drupal\utilikit_ai\Service\RuleCatalogueInterface: '@utilikit_ai.rule_catalogue'

  # Decides whether a candidate class will actually produce CSS here. Holds no
  # rule data of its own; it asks the catalogue.
  utilikit_ai.class_validator:
    class: Drupal\utilikit_ai\Service\ClassValidator
    arguments:
      - '@utilikit_ai.rule_catalogue'

  Drupal\utilikit_ai\Service\ClassValidatorInterface: '@utilikit_ai.class_validator'

  # Why a valid class still does nothing: the mode, the auto-update settings,
  # or a text filter. None of the three is visible from the page, and a model
  # asked "why isn't my class working?" will guess the most common one and be
  # wrong most of the time.
  utilikit_ai.setup_doctor:
    class: Drupal\utilikit_ai\Service\SetupDoctor
    arguments:
      - '@config.factory'
      - '@entity_type.manager'

  Drupal\utilikit_ai\Service\SetupDoctorInterface: '@utilikit_ai.setup_doctor'

  # The only service here that writes, and it only ever adds a class attribute.
  # It takes the validator and the doctor and re-runs both, so a model that
  # skips check_classes or diagnose_setup cannot cause a bad write — the
  # redundancy IS the safety model.
  utilikit_ai.class_applier:
    class: Drupal\utilikit_ai\Service\ClassApplier
    arguments:
      - '@entity_type.manager'
      - '@current_user'
      - '@utilikit_ai.class_validator'
      - '@utilikit_ai.setup_doctor'

  Drupal\utilikit_ai\Service\ClassApplierInterface: '@utilikit_ai.class_applier'

  # The chat surface. It reads six things that are each invisible from a node
  # form — a permission, two modules, a setting, an assistant, and whether the
  # content type has anywhere to write — which is why the decision lives here
  # where it can be tested one refusal at a time.
  utilikit_ai.chat_surface:
    class: Drupal\utilikit_ai\Service\ChatSurface
    arguments:
      - '@config.factory'
      - '@module_handler'
      - '@entity_type.manager'
      - '@entity_field.manager'
      - '@current_user'
      - '@plugin.manager.block'

  Drupal\utilikit_ai\Service\ChatSurfaceInterface: '@utilikit_ai.chat_surface'

  # Hook classes are services in Drupal 11's OOP hook system, and this one
  # takes the surface rather than reaching for \Drupal::service().
  Drupal\utilikit_ai\Hook\UtilikitAiFormHook:
    autowire: true
