name: 'UtiliKit Test Suite'
type: module
description: 'Automated test suite for UtiliKit utility classes'
package: UtiliKit
# Matches the parent exactly, and must keep matching it. Every module here
# declares `utilikit:utilikit` as a dependency, so it can only ever run where
# utilikit runs — claiming ^10 advertised a Drupal 10 install that the
# dependency would refuse, and ^11.0/^11.1 a Drupal 11 that utilikit's own
# RequirementSeverity use fatals on. A submodule's version claim is a promise
# about the whole stack, not about its own file.
core_version_requirement: ^11.2 || ^12
dependencies:
  - utilikit:utilikit
