# UtiliKit Configuration Schema Definition
#
# This file defines the complete configuration schema for the UtiliKit module,
# providing structure validation, type safety, and user interface metadata
# for all configurable settings and options.
#
# Schema Architecture:
# - Core Rendering Settings: Primary operational mode and behavior
# - Performance & Optimization: CSS generation and delivery optimization
# - Scope & Visibility: Control where UtiliKit operates on the site
# - Automatic Updates: Entity-based triggers for CSS regeneration
# - Developer Tools: Debugging, logging, and development features
# - Advanced Settings: Performance tuning and operational limits
# - File Management: CSS file location and naming configuration
# - Feature Flags: Experimental and beta functionality controls
#
# Validation Strategy:
# - Type safety for all configuration values
# - Range constraints for numeric values to prevent performance issues
# - Choice constraints for enumerated values to ensure valid options
# - Label metadata for administrative interface generation

utilikit.settings:
  type: config_object
  label: 'UtiliKit settings'
  mapping:

    # =========================================================================
    # CORE RENDERING SETTINGS
    # =========================================================================
    # Primary operational configuration determining how UtiliKit generates
    # and delivers CSS to the frontend. These settings fundamentally affect
    # performance, caching, and development workflow.

    # Rendering mode selection - determines CSS generation strategy
    # 'inline': Real-time client-side CSS generation for development
    # 'static': Pre-generated server-side CSS files for production
    rendering_mode:
      type: string
      label: 'Rendering mode'
      constraints:
        Choice:
          choices:
            - inline    # Dynamic CSS generation with JavaScript
            - static    # Pre-generated CSS files with server delivery
            - head      # Server-generated CSS injected in page head
    # =========================================================================
    # PERFORMANCE & OPTIMIZATION SETTINGS
    # =========================================================================
    # Configuration options that directly impact frontend performance,
    # user experience, and CSS generation efficiency.

    # Enable CSS transitions for smooth visual effects
    # Adds transition properties to utility classes for enhanced UX
    enable_transitions:
      type: boolean
      label: 'Enable smooth transitions'

    # Debounce delay for resize events to prevent excessive processing
    # Controls how long to wait after resize before updating responsive styles
    debounce:
      type: integer
      label: 'Resize debounce delay in milliseconds'
      constraints:
        Range:
          min: 0      # Immediate response (may impact performance)
          max: 1000   # Maximum 1-second delay for user experience

    # CSS output optimization including minification and compression
    # Reduces file size and improves loading performance in static mode
    optimize_css:
      type: boolean
      label: 'Optimize CSS output'

    # Use Important to force the style specially if your site is using vars.
    # Make sure your style is applied
    use_important:
      type: boolean
      label: 'Optimize CSS output'

    # Active responsive breakpoints configuration
    # Controls which breakpoint variants are available for utility classes
    # Each breakpoint can be enabled or disabled independently
    active_breakpoints:
      type: mapping
      label: 'Active responsive breakpoints'
      mapping:
        # Small devices (landscape phones, 576px and up)
        sm:
          type: string
          label: 'Small breakpoint (≥576px)'
          constraints:
            Choice:
              choices:
                - sm    # Enable small breakpoint
                - ''    # Disable small breakpoint

        # Medium devices (tablets, 768px and up)
        md:
          type: string
          label: 'Medium breakpoint (≥768px)'
          constraints:
            Choice:
              choices:
                - md    # Enable medium breakpoint
                - ''    # Disable medium breakpoint

        # Large devices (desktops, 992px and up)
        lg:
          type: string
          label: 'Large breakpoint (≥992px)'
          constraints:
            Choice:
              choices:
                - lg    # Enable large breakpoint
                - ''    # Disable large breakpoint

        # Extra large devices (large desktops, 1200px and up)
        xl:
          type: string
          label: 'Extra Large breakpoint (≥1200px)'
          constraints:
            Choice:
              choices:
                - xl    # Enable extra large breakpoint
                - ''    # Disable extra large breakpoint

        # Extra extra large devices (largest screens, 1400px and up)
        xxl:
          type: string
          label: 'Extra Extra Large breakpoint (≥1400px)'
          constraints:
            Choice:
              choices:
                - xxl   # Enable extra extra large breakpoint
                - ''    # Disable extra extra large breakpoint

    # =========================================================================
    # SCOPE & VISIBILITY SETTINGS
    # =========================================================================
    # Configuration that determines where and when UtiliKit is active
    # on the site, providing granular control over functionality scope.

    # Global scope enablement - affects all pages when enabled
    # When disabled, UtiliKit operates only in configured content types
    scope_global:
      type: boolean
      label: 'Enable globally on all pages'

    # Admin route exclusion for performance and compatibility
    # Prevents UtiliKit from loading on administrative pages
    disable_admin:
      type: boolean
      label: 'Disable on admin pages'

    # Content type specific scope limitation
    # When enabled, UtiliKit only operates on specified content types
    scope_content_types:
      type: boolean
      label: 'Limit to specific content types'

    # List of content types where UtiliKit should be active
    # Only used when scope_content_types is enabled
    enabled_content_types:
      type: sequence
      label: 'Enabled content types'
      sequence:
        type: string
        label: 'Content type machine name'

    # ADD THIS NEW SECTION:
    # =========================================================================
    # CONTENT SCANNING SCOPE
    # =========================================================================
    # Entity types to scan for UtiliKit utility classes during CSS generation
    # Limiting scan scope improves performance for large sites

    # List of entity types to scan for utility classes
    # Controls which entities are processed during content scanning operations
    scanning_entity_types:
      type: sequence
      label: 'Entity types to scan for utility classes'
      sequence:
        type: string
        label: 'Entity type machine name'

    # =========================================================================
    # AUTOMATIC UPDATE TRIGGERS (STATIC MODE)
    # =========================================================================
    # Entity-based triggers that automatically regenerate CSS when content
    # changes. Only functional in static rendering mode.

    # Automatically update CSS when nodes are saved
    # Scans node content for new utility classes and regenerates CSS
    update_on_node_save:
      type: boolean
      label: 'Update CSS when saving nodes'

    # Automatically update CSS when custom blocks are saved
    # Scans block content for new utility classes and regenerates CSS
    update_on_block_save:
      type: boolean
      label: 'Update CSS when saving custom blocks'

    # Automatically update CSS when paragraphs are saved
    # Scans paragraph content for new utility classes and regenerates CSS
    update_on_paragraph_save:
      type: boolean
      label: 'Update CSS when saving paragraphs'

    # =========================================================================
    # DEVELOPER TOOLS SETTINGS
    # =========================================================================
    # Development and debugging features that assist with implementation,
    # troubleshooting, and optimization during development workflows.

    # Developer mode activation for enhanced debugging features
    # Enables additional logging, validation, and development tools
    dev_mode:
      type: boolean
      label: 'Enable developer mode'

    # Visual debugging mode for utility class validation
    # Provides visual feedback for utility class application and errors
    admin_preview:
      type: boolean
      label: 'Visual debugging mode'

    # Display validation errors directly on pages
    # Shows CSS generation errors to end users (use with caution)
    show_page_errors:
      type: boolean
      label: 'Display validation errors on page'

    # Console logging verbosity level
    # Controls the amount of debugging information sent to browser console
    log_level:
      type: string
      label: 'Console logging level'
      constraints:
        Choice:
          choices:
            - off       # No console logging
            - warnings  # Warnings and errors only
            - detailed  # Comprehensive debug information

    # =========================================================================
    # ADVANCED SETTINGS
    # =========================================================================
    # Performance tuning and operational limits for high-traffic sites
    # and large-scale deployments. Adjust carefully based on server capacity.

    # Batch processing size for content scanning operations
    # Controls how many entities are processed per batch to prevent timeouts
    batch_size:
      type: integer
      label: 'Content scanning batch size'
      constraints:
        Range:
          min: 10     # Minimum batch size for progress feedback
          max: 200    # Maximum to prevent memory exhaustion

    # Maximum utility classes processed per AJAX request
    # Rate limiting to prevent abuse and server overload
    max_classes_per_request:
      type: integer
      label: 'Maximum classes per AJAX request'
      constraints:
        Range:
          min: 100    # Minimum for functional utility
          max: 10000  # Maximum to prevent server overload

    # Rate limiting for AJAX requests per minute
    # Prevents excessive API usage and protects server resources
    rate_limit_requests:
      type: integer
      label: 'Rate limit requests per minute'
      constraints:
        Range:
          min: 10     # Minimum for functional development
          max: 300    # Maximum for high-traffic sites

    # CSS cache time-to-live in seconds
    # Controls how long generated CSS is cached before regeneration
    css_cache_ttl:
      type: integer
      label: 'CSS cache time-to-live in seconds'
      constraints:
        Range:
          min: 300    # Minimum 5 minutes for development
          max: 86400  # Maximum 24 hours for production

    # =========================================================================
    # FILE MANAGEMENT SETTINGS
    # =========================================================================
    # Configuration for CSS file generation, storage, and delivery
    # in static rendering mode.

    # CSS output directory path within the files directory
    # Defines where generated CSS files are stored
    css_directory:
      type: string
      label: 'CSS output directory'

    # CSS output filename for generated stylesheets
    # Controls the name of the generated CSS file in static mode
    css_filename:
      type: string
      label: 'CSS output filename'

    # =========================================================================
    # LEGACY/MIGRATION SUPPORT
    # =========================================================================
    # Compatibility settings for migrating from older versions
    # and maintaining backwards compatibility during transitions.

    # Legacy compatibility mode for older implementations
    # Enables backwards compatibility features for migration scenarios
    legacy_mode:
      type: boolean
      label: 'Enable legacy compatibility mode'

    # Migration completion flag for tracking upgrade status
    # Indicates successful migration to current architecture
    migration_complete:
      type: boolean
      label: 'Migration to new architecture complete'

    # =========================================================================
    # EXPERIMENTAL FEATURE FLAGS
    # =========================================================================
    # Beta and experimental functionality that may be unstable
    # or require additional testing before production use.

    experimental_features:
      type: mapping
      label: 'Experimental features'
      mapping:
        # Automatic grid template generation for complex layouts
        # EXPERIMENTAL: May impact performance with large grids
        grid_auto_generation:
          type: boolean
          label: 'Auto-generate grid templates'

        # Support for advanced CSS selectors and pseudo-classes
        # EXPERIMENTAL: Complex selectors may affect CSS generation performance
        advanced_selectors:
          type: boolean
          label: 'Support advanced CSS selectors'

        # CSS custom properties (variables) generation
        # EXPERIMENTAL: Browser compatibility and performance considerations
        css_variables:
          type: boolean
          label: 'Generate CSS custom properties'

        # Media query optimization and consolidation
        # EXPERIMENTAL: Complex optimization that may affect CSS output
        media_query_optimization:
          type: boolean
          label: 'Optimize media query output'

# =============================================================================
# SCHEMA VALIDATION NOTES
# =============================================================================
#
# Type Safety:
# - All configuration values have explicit type definitions
# - Boolean values prevent invalid string/integer assignments
# - String values with Choice constraints ensure valid enumeration
# - Integer values with Range constraints prevent performance issues
#
# Performance Considerations:
# - Batch size limits prevent memory exhaustion during content scanning
# - Rate limiting protects against API abuse and server overload
# - Cache TTL balances performance with update frequency
# - Debounce settings prevent excessive resize event processing
#
# Security Considerations:
# - Rate limiting prevents potential denial-of-service attacks
# - File path validation ensures secure file operations
# - Choice constraints prevent injection of invalid configuration values
# - Range constraints prevent resource exhaustion attacks
#
# Development Workflow:
# - Developer mode settings provide enhanced debugging without affecting production
# - Experimental features are clearly flagged and disabled by default
# - Legacy support enables gradual migration from older versions
# - Comprehensive logging levels support different development stages
