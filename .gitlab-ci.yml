###############################################################################
# UtiliKit Module — GitLab CI/CD Pipeline
#
# Runs coding standards checks and PHPUnit test suites (unit, kernel,
# functional) against a Drupal 11 environment.
###############################################################################

variables:
  DRUPAL_VERSION: "^11"
  SIMPLETEST_DB: "sqlite://tmp/test.sqlite"
  SIMPLETEST_BASE_URL: "http://localhost:8888"
  COMPOSER_ALLOW_SUPERUSER: "1"
  COMPOSER_NO_INTERACTION: "1"
  COMPOSER_MEMORY_LIMIT: "-1"
  DRUPAL_DIR: "${CI_PROJECT_DIR}/drupal"

stages:
  - build
  - lint
  - test

# ---------------------------------------------------------------------------
# Build stage: set up Drupal + install the module
# ---------------------------------------------------------------------------
build:
  stage: build
  image: php:8.3-cli
  before_script:
    - apt-get update && apt-get install -y git unzip sqlite3 libsqlite3-dev libpng-dev libzip-dev
    - docker-php-ext-install gd pdo_sqlite zip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    # Create Drupal project with dev dependencies (includes PHPUnit)
    - composer create-project drupal/recommended-project:${DRUPAL_VERSION} ${DRUPAL_DIR} --no-progress --dev
    - cd ${DRUPAL_DIR}
    # Install PHPUnit and testing dependencies
    - composer require --dev phpunit/phpunit --no-progress --with-all-dependencies
    # Copy the module into the Drupal project
    - mkdir -p web/modules/contrib/utilikit
    - cp -r ${CI_PROJECT_DIR}/src web/modules/contrib/utilikit/
    - cp -r ${CI_PROJECT_DIR}/tests web/modules/contrib/utilikit/
    - cp -r ${CI_PROJECT_DIR}/modules web/modules/contrib/utilikit/
    - cp -r ${CI_PROJECT_DIR}/config web/modules/contrib/utilikit/
    - cp -r ${CI_PROJECT_DIR}/js web/modules/contrib/utilikit/
    - cp -r ${CI_PROJECT_DIR}/css web/modules/contrib/utilikit/
    - cp -r ${CI_PROJECT_DIR}/templates web/modules/contrib/utilikit/ 2>/dev/null || true
    - cp ${CI_PROJECT_DIR}/utilikit.info.yml web/modules/contrib/utilikit/
    - cp ${CI_PROJECT_DIR}/utilikit.module web/modules/contrib/utilikit/
    - cp ${CI_PROJECT_DIR}/utilikit.services.yml web/modules/contrib/utilikit/
    - cp ${CI_PROJECT_DIR}/utilikit.routing.yml web/modules/contrib/utilikit/
    - cp ${CI_PROJECT_DIR}/utilikit.permissions.yml web/modules/contrib/utilikit/
    - cp ${CI_PROJECT_DIR}/utilikit.libraries.yml web/modules/contrib/utilikit/
    - cp ${CI_PROJECT_DIR}/utilikit.install web/modules/contrib/utilikit/ 2>/dev/null || true
    - cp ${CI_PROJECT_DIR}/utilikit.links.menu.yml web/modules/contrib/utilikit/ 2>/dev/null || true
    - cp ${CI_PROJECT_DIR}/phpunit.xml web/modules/contrib/utilikit/
    # Verify phpunit exists
    - ./vendor/bin/phpunit --version
  artifacts:
    paths:
      - drupal/
    expire_in: 1 hour

# ---------------------------------------------------------------------------
# Lint: Drupal coding standards (advisory)
# ---------------------------------------------------------------------------
phpcs:
  stage: lint
  image: php:8.3-cli
  needs: []
  before_script:
    - apt-get update && apt-get install -y git unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - mkdir -p "$HOME/.composer"
    - composer global require --no-progress drupal/coder:^8.3 dealerdirect/phpcodesniffer-composer-installer:^1.0
    - export PATH="$HOME/.composer/vendor/bin:$PATH"
    - phpcs -i
  script:
    - phpcs --standard=Drupal,DrupalPractice --extensions=php,module,install,inc src/ modules/ || true
  allow_failure: true

# ---------------------------------------------------------------------------
# Test templates
# ---------------------------------------------------------------------------
.test_base:
  stage: test
  image: php:8.3-cli
  needs:
    - build
  before_script:
    - apt-get update && apt-get install -y sqlite3 libsqlite3-dev libpng-dev libzip-dev
    - docker-php-ext-install gd pdo_sqlite zip

# ---------------------------------------------------------------------------
# Unit tests (no database required)
# ---------------------------------------------------------------------------
unit_tests:
  extends: .test_base
  script:
    - cd ${DRUPAL_DIR}
    - ./vendor/bin/phpunit -c web/modules/contrib/utilikit/phpunit.xml --bootstrap web/core/tests/bootstrap.php --testsuite unit --no-progress

# ---------------------------------------------------------------------------
# Kernel tests (SQLite database)
# ---------------------------------------------------------------------------
kernel_tests:
  extends: .test_base
  script:
    - cd ${DRUPAL_DIR}
    - ./vendor/bin/phpunit -c web/modules/contrib/utilikit/phpunit.xml --bootstrap web/core/tests/bootstrap.php --testsuite kernel --no-progress

# ---------------------------------------------------------------------------
# Functional tests (SQLite + web server)
# ---------------------------------------------------------------------------
functional_tests:
  extends: .test_base
  script:
    - cd ${DRUPAL_DIR}
    - mkdir -p web/sites/simpletest/browser_output
    - php -S localhost:8888 -t web &>/dev/null &
    - sleep 2
    - ./vendor/bin/phpunit -c web/modules/contrib/utilikit/phpunit.xml --bootstrap web/core/tests/bootstrap.php --testsuite functional --no-progress
  allow_failure: true
