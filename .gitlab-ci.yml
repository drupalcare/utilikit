# GitLab CI for drupal.org (git.drupalcode.org).
#
# WHAT THIS REPLACED, and why. utilikit was the only project in this family
# still on a hand-rolled pipeline, and it had three structural problems that a
# green pipeline hid completely:
#
# 1. THE PHPCS JOB COULD NOT REPORT ANYTHING. It died in before_script —
#    dealerdirect/phpcodesniffer-composer-installer is blocked by Composer's
#    allow-plugins, so phpcs was never invoked at all. Even had it run, the
#    command ended in `|| true`, discarding the result, and the job was
#    `allow_failure: true` on top of that. Three independent layers of nothing.
#
# 2. IT NEVER TESTED THE DRUPAL 12 THE MODULE ADVERTISES. utilikit.info.yml and
#    composer.json both claim `^11.2 || ^12`; the pipeline pinned
#    DRUPAL_VERSION: "^11" and built a Drupal 11 site. Half the compatibility
#    promise was verified nowhere.
#
# 3. IT ASSEMBLED THE MODULE WITH A HAND-MAINTAINED LIST OF `cp` COMMANDS, and
#    the list had gaps. `drush.services.yml` was not among them, so the module's
#    ~650 lines of Drush commands were unregistered in every test run and any
#    test of them tested nothing. `composer.json`, `phpcs.xml.dist` and
#    `phpstan.neon` were missing too. Every new top-level file needed someone to
#    remember — and nothing failed when they did not.
#
# The Drupal Association templates solve all three by construction: they build
# the project as Composer sees it, so there is no list to maintain, and they
# supply phpcs, phpstan, eslint, stylelint, cspell and phpunit as maintained
# jobs. Docs: https://project.pages.drupalcode.org/gitlab_templates/
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

################
# Test every core version this module actually claims.
#
# `utilikit.info.yml` declares `core_version_requirement: ^11.2 || ^12`, but the
# DA template tests only the CURRENT core version by default; every other
# variant defaults to off. A module can therefore advertise support for a core
# version no job has ever loaded it on — which is precisely the state utilikit
# was in.
#
# TWO SWITCHES ARE NEEDED PER VARIANT, NOT ONE. `OPT_IN_TEST_*` decides whether
# the job is created at all; `_AUTORUN_*` decides whether it runs on its own or
# falls through to *make-job-manual. Both template defaults ('0' and 'none')
# have to be overridden. Set only the first and the job appears in the pipeline
# and is then silently skipped behind a manual prerequisite — a green pipeline
# with no coverage, which is worse than a missing job because it looks fine.
#
# PREVIOUS MINOR is on because `^11.2` is a real claim: current core has moved
# well past 11.2, so without this job the oldest version this module says it
# supports is never exercised.
#
# NEXT MAJOR is on because `^12` is a real claim too, and was the single
# largest hole in the old pipeline. The template marks these jobs
# `allow_failure: true`, so it does not gate a merge — it makes a Drupal 12
# break visible instead of leaving it to a site owner to find.
#
# PREVIOUS MAJOR is deliberately absent: Drupal 10 was dropped on purpose (see
# the note in utilikit.info.yml), so testing it would assert support the module
# does not offer.
################
variables:
  OPT_IN_TEST_PREVIOUS_MINOR: '1'
  _AUTORUN_PREVIOUS_MINOR: 'all'
  OPT_IN_TEST_NEXT_MAJOR: '1'
  _AUTORUN_NEXT_MAJOR: 'all'

################
# The JavaScript tests, which had never run anywhere.
#
# Roughly a third of this module is JavaScript, and it shipped with Jest tests
# that could not execute: `jest` was not a dependency, `npm test` was wired to
# phpunit, and no job invoked them. They were not merely unrun — the rules suite
# never loaded the file it named, mocking the registry and asserting against its
# own mock, so it could not have failed for any change to the module.
#
# The DA templates do not provide a JavaScript test job, so this one is local.
# It is deliberately NOT allow_failure: a test that cannot fail the build is the
# thing this whole file exists to stop repeating.
################
javascript_tests:
  stage: test
  image: node:20-alpine
  needs: []
  script:
    - npm ci --no-audit --no-fund
    - npm run test:js
  # No artifacts block: jest is not configured to emit a JUnit report here, and
  # declaring one it does not produce would be a promise the job cannot keep.
